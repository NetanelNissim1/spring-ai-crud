version: '3.8'

services:
  # ===================================================================
  # PostgreSQL Database (with pgvector extension pre-installed)
  # ===================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: spring-ai-postgres
    restart: always
    environment:
      POSTGRES_DB: productdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d productdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===================================================================
  # pgAdmin 4 - Web UI for PostgreSQL Management (Optional)
  # Access at http://localhost:5050 (login: admin@example.com / admin)
  # ===================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: spring-ai-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
