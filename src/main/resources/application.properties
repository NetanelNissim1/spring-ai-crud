# ===================================================================
# Production Product Catalog Application Configuration
# ===================================================================
spring.application.name=product-catalog-service
server.port=8080

# ===================================================================
# PostgreSQL Production Database Configuration
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/productdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA & Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# AI Engine Configuration (OpenAI / Ollama / Compatible Providers)
# ===================================================================
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:demo-key}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.7
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://api.openai.com}

# Resilient fallback mode (offline/demo execution without API key)
app.ai.mock-fallback-enabled=true

# ===================================================================
# API Documentation & Endpoints
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# ===================================================================
# Logging & Daily Rolling REST Execution & Error Log Files
# ===================================================================
logging.file.path=logs
logging.rest.file-name=logs/rest-execution.log
logging.rest.file-pattern=logs/rest-execution-%d{yyyy-MM-dd}.log
logging.error.file-name=logs/error.log
logging.error.file-pattern=logs/error-%d{yyyy-MM-dd}.log
logging.rest.max-history=30
logging.level.com.example.aicrud=INFO
logging.level.org.springframework.ai=INFO
logging.level.REST_EXECUTION_LOGGER=INFO
