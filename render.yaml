services:
  - type: web
    name: spring-ai-crud-backend
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/products/categories
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: productdb
          property: connectionString
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: APP_AI_MOCK_FALLBACK_ENABLED
        value: "true"

databases:
  - name: productdb
    databaseName: productdb
    plan: free
